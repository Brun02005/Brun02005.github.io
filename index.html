  <style>
    :root {
      --bg: #0c0d0f; --bar: #121418; --fg: #d6d6d6; --dim: #7d8590; --border: #23272e;
      --green: #3ddc97; --amber: #f0b35a; --cyan: #6cb6ff; --red: #ff7b72; --sel: rgba(61,220,151,.22);
      --mono: "JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f6f3ea; --bar: #ece8dc; --fg: #24292f; --dim: #6e7781; --border: #d8d3c4;
        --green: #0f8a5f; --amber: #9a6700; --cyan: #0969da; --red: #cf222e; --sel: rgba(15,138,95,.18);
      }
    }
    :root[data-theme="light"] {
      --bg: #f6f3ea; --bar: #ece8dc; --fg: #24292f; --dim: #6e7781; --border: #d8d3c4;
      --green: #0f8a5f; --amber: #9a6700; --cyan: #0969da; --red: #cf222e; --sel: rgba(15,138,95,.18);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    body { font: 15px/1.6 var(--mono); -webkit-font-smoothing: antialiased; min-height: 100vh; }
    ::selection { background: var(--sel); }
    a { color: var(--cyan); text-decoration: none; border-bottom: 1px dashed currentColor; }
    a:hover { color: var(--green); }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    p { margin: 0 0 10px; }

    /* ---------- barra superior ---------- */
    .top {
      position: sticky; top: 0; z-index: 5; background: var(--bar); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 0 16px; height: 40px; font-size: 13px; color: var(--dim);
    }
    .tab { color: var(--fg); display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab b { color: var(--green); font-weight: 600; }
    .top-actions { display: flex; gap: 4px; flex: none; }
    .top button { font: inherit; color: var(--dim); background: none; border: 1px solid transparent; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
    .top button:hover { color: var(--fg); border-color: var(--border); }

    /* ---------- terminal ---------- */
    main { max-width: 980px; margin: 0 auto; padding: 18px 16px 150px; }
    .blk { margin: 0 0 14px; animation: in .18s ease-out; }
    @keyframes in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
    .echo { margin: 22px 0 8px; color: var(--fg); word-break: break-word; }
    .ps1 { color: var(--green); font-weight: 600; white-space: nowrap; }
    .ps1 .path { color: var(--cyan); }
    pre { font: inherit; margin: 0; }
    .dim { color: var(--dim); }
    .g { color: var(--green); }
    .a { color: var(--amber); }
    .c { color: var(--cyan); }
    .r { color: var(--red); }
    .h { color: var(--amber); font-weight: 700; margin-bottom: 10px; }
    .ascii { color: var(--green); line-height: 1; font-size: 13px; margin-bottom: 12px; white-space: pre; overflow: hidden; }
    @media (max-width: 640px) { .ascii { font-size: 7.4px; } }

    /* tablas tipo "ls" / clave-valor */
    .rows { display: grid; grid-template-columns: max-content 1fr; column-gap: 22px; row-gap: 4px; }
    .rows > :nth-child(odd) { color: var(--dim); }
    @media (max-width: 560px) {
      .rows { grid-template-columns: 1fr; row-gap: 0; }
      .rows > :nth-child(even) { margin-bottom: 8px; }
    }
    button.cmd {
      font: inherit; color: var(--cyan); background: none; border: 0; padding: 0; cursor: pointer;
      border-bottom: 1px dashed currentColor; text-align: left;
    }
    button.cmd:hover { color: var(--green); }

    /* casos de proyecto */
    .case-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 10px; }
    .case-title strong { color: var(--fg); font-size: 17px; }
    .tag { font-size: 12px; padding: 1px 8px; border: 1px solid currentColor; border-radius: 4px; }
    figure { margin: 4px 0 14px; max-width: 760px; }
    figure img { display: block; width: 100%; height: auto; border: 1px solid var(--border); border-radius: 6px; background: var(--bar); }
    figcaption { color: var(--dim); font-size: 12.5px; margin-top: 6px; }
    .quote { border-left: 2px solid var(--amber); padding: 2px 0 2px 14px; margin: 14px 0; font-style: italic; }
    .quote .dim { font-style: normal; display: block; margin-top: 4px; }

    /* ecualizador del comando musica */
    .eq { display: inline-flex; gap: 3px; align-items: flex-end; height: 16px; margin-left: 10px; vertical-align: -2px; }
    .eq i { width: 4px; background: var(--green); animation: eq 1s ease-in-out infinite; }
    .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
    .eq i:nth-child(4) { animation-delay: -.15s; } .eq i:nth-child(5) { animation-delay: -.45s; }
    @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 16px; } }

    /* ---------- línea de comando ---------- */
    .prompt { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
    .prompt label { flex: none; }
    #cmd {
      flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--fg); background: transparent;
      border: 0; outline: none; caret-color: var(--green); padding: 2px 0;
    }
    #cmd::placeholder { color: var(--dim); opacity: .7; }

    /* ---------- atajos + barra de estado ---------- */
    .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bar); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
    .chips { display: flex; gap: 6px; padding: 8px 16px; overflow-x: auto; scrollbar-width: none; max-width: 980px; margin: 0 auto; }
    .chips::-webkit-scrollbar { display: none; }
    .chips button {
      font: inherit; font-size: 13px; flex: none; color: var(--fg); background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer;
    }
    .chips button:hover { border-color: var(--green); color: var(--green); }
    .status { display: flex; justify-content: space-between; gap: 12px; padding: 2px 16px 4px; font-size: 12px; color: var(--dim); max-width: 980px; margin: 0 auto; }
    .status .live::before { content: "●"; color: var(--green); margin-right: 6px; }
    @media (max-width: 520px) { .status .hide-sm { display: none; } }

    @media (prefers-reduced-motion: reduce) {
      .blk { animation: none; }
      .eq i { animation: none; height: 10px; }
    }
    noscript { display: block; max-width: 760px; margin: 0 auto; padding: 24px 16px; }

<script>
(function () {
  "use strict";

  var out = document.getElementById("out");
  var input = document.getElementById("cmd");
  var form = document.getElementById("form");
  var root = document.documentElement;
  var touch = matchMedia("(hover: none)").matches;

  // ---------------- utilidades ----------------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function block(html, cls) {
    var div = document.createElement("div");
    div.className = "blk" + (cls ? " " + cls : "");
    div.innerHTML = html;
    out.appendChild(div);
    return div;
  }
  function cmdLink(cmd, label) {
    return '<button type="button" class="cmd" data-cmd="' + esc(cmd) + '">' + esc(label || cmd) + "</button>";
  }
  function rows(pairs) {
    return '<div class="rows">' + pairs.map(function (p) { return "<span>" + p[0] + "</span><span>" + p[1] + "</span>"; }).join("") + "</div>";
  }
  function hint(cmds) {
    return '<div class="dim" style="margin-top:12px">→ probá: ' + cmds.map(function (c) { return cmdLink(c); }).join(" · ") + "</div>";
  }
  function ext(url, label) {
    return '<a href="' + url + '" target="_blank" rel="noopener">' + label + " ↗</a>";
  }

  // ---------------- contenido ----------------
  var LETTERS = {
    B: ["██████╗ ", "██╔══██╗", "██████╔╝", "██╔══██╗", "██████╔╝", "╚═════╝ "],
    R: ["██████╗ ", "██╔══██╗", "██████╔╝", "██╔══██╗", "██║  ██║", "╚═╝  ╚═╝"],
    U: ["██╗   ██╗", "██║   ██║", "██║   ██║", "██║   ██║", "╚██████╔╝", " ╚═════╝ "],
    N: ["███╗   ██╗", "████╗  ██║", "██╔██╗ ██║", "██║╚██╗██║", "██║ ╚████║", "╚═╝  ╚═══╝"],
    O: [" ██████╗ ", "██╔═══██╗", "██║   ██║", "██║   ██║", "╚██████╔╝", " ╚═════╝ "]
  };
  var ASCII = [0, 1, 2, 3, 4, 5].map(function (i) {
    return "BRUNO".split("").map(function (l) { return LETTERS[l][i]; }).join("");
  }).join("\n").replace(/[╗╔╝╚═║]/g, " ").replace(/ +$/gm, "");  // solo bloques: las sombras se superponen

  var PROJECTS = {
    aym: {
      dir: "aym-piscinas", short: "cotizador online + CRM · en producción",
      title: "A&amp;M Piscinas — cotizador online y CRM", tag: ["g", "EN PRODUCCIÓN"],
      img: ["assets/aym-catalogo.png", "assets/aym-hero.png"], caption: "Captura real del sitio en producción.",
      rows: [
        ["problema", "Los clientes se gestionaban en papel y se perdían en el seguimiento."],
        ["decisión", "Digitalizar todo y poner la seguridad donde viven los datos: permisos con Row Level Security en PostgreSQL y claves secretas solo en funciones del servidor."],
        ["resultado", "La digitalización llevó las ventas <span class=\"g\">+10 %</span>. Hoy los clientes arman su piscina online, ven el precio al instante y reciben el presupuesto en PDF por WhatsApp."],
        ["stack", "JavaScript · Supabase (PostgreSQL, Auth, Storage) · Cloudflare Pages Functions · Turnstile"],
        ["links", ext("https://aym-piscinas.pages.dev", "ver sitio") + ' <span class="dim">· código privado (cliente)</span>']
      ]
    },
    acceso: {
      dir: "control-acceso", short: "reconocimiento facial con prueba de vida",
      title: "Control de acceso biométrico", tag: ["c", "VISIÓN POR COMPUTADORA"],
      img: ["assets/acceso-calibracion.png"], caption: "Calibración real del umbral sobre el benchmark LFW (2.308 identidades).",
      rows: [
        ["problema", "Controlar quién entra sin tarjetas ni llaves, y sin que una foto alcance para engañar al sistema."],
        ["decisión", "Medir el umbral de similitud en vez de elegirlo a ojo. El script sugería 0,22; elegí 0,35: el falso rechazo casi no cambia y la falsa aceptación baja unas 10 veces."],
        ["resultado", "Falsa aceptación <span class=\"g\">~0,008 %</span> (1 en 12.500) · falso rechazo ~1,4 % · prueba de vida por parpadeo · biometría cifrada en reposo."],
        ["stack", "Python · OpenCV · MediaPipe · InsightFace · ONNX Runtime · cryptography"],
        ["links", ext("https://github.com/Brun02005/control-acceso-facial", "código")]
      ]
    },
    bluedar: {
      dir: "blue-dar", short: "auditoría pasiva de entornos Bluetooth",
      title: "BLUE-DAR — análisis pasivo de entornos BLE", tag: ["a", "CIBERSEGURIDAD"],
      img: ["assets/bluedar.png"], caption: "Interfaz web corriendo con datos simulados.",

        ["problema", "Auditar el entorno Bluetooth sin convertir la herramienta en un rastreador de personas."],

        ["resultado", "Clasificación explicable (regla + nivel de evidencia), detección de BLE spam, 61 tests, informe técnico y plan experimental."],
        ["stack", "Python · Bleak (BLE) · FastAPI · JavaScript · pytest · ESP32"],
        ["links", ext("https://github.com/Brun02005/BLUE-DAR", "código")]
      ]
    },
    waveload: {
      dir: "waveload", short: "gestión y análisis de catálogos de audio",
      title: "WaveLoad — gestión y análisis de audio", tag: ["c", "ESCRITORIO"],
      img: ["assets/waveload.png"], caption: "Vista de la librería: BPM, tono y energía calculados para cada tema.",
      rows: [
        ["problema", "Una biblioteca de casi 800 temas para pinchar y ninguna herramienta que la organizara como yo quería."],
        ["decisión", "Arquitectura hexagonal (el dominio no sabe nada de la base ni de la interfaz), workers en segundo plano y un motor de consultas que compila filtros de etiquetas a SQL."],

  var ORDER = ["aym", "acceso", "bluedar", "waveload", "mathvision"];

  function figure(srcs, caption) {
    return '<figure data-src="' + srcs.join("|") + '"><img alt="' + esc(caption) + '" loading="lazy"><figcaption>' + caption + "</figcaption></figure>";
  }
  // Prueba las imágenes en orden y oculta la figura si ninguna existe.
  function wireFigures(scope) {
    scope.querySelectorAll("figure[data-src]").forEach(function (fig) {
      var list = fig.getAttribute("data-src").split("|");
      var img = fig.querySelector("img");
      var i = 0;
      img.onerror = function () { i++; if (i < list.length) img.src = list[i]; else fig.remove(); };
      img.src = list[0];
    });
  }

  var C = {};

  C.help = function () {
    block(rows([
      [cmdLink("whoami"), "quién soy"],
      [cmdLink("historia"), "de vender piscinas a programar"],
      [cmdLink("proyectos"), "lo que construí"],

  C.whoami = function () {

      hint(["historia", "proyectos", "contacto"]));

  C.historia = function () {
    block('<div class="h"># historia.md</div>' +
      "<p>Siempre me gustó crear. Antes de escribir código ya armaba cosas: campañas, sets de música, formas nuevas de hacer lo de siempre.</p>" +
      "<p>Empecé en ventas y marketing en A&amp;M Piscinas. Ahí aprendí lo más importante: escuchar. Cuando vi que el papel nos hacía perder clientes, construí mi primer sistema de verdad. Las ventas subieron un 10 % y entendí que programar era otra forma de crear.</p>" +
      "<p>Hoy estudio Ingeniería en Sistemas en la UTN, me formo en ciberseguridad y construyo proyectos que juntan lo que me apasiona: diseño, música, seguridad e inteligencia artificial.</p>" +
      "<p>Mi referente es <span class=\"a\">Steve Jobs</span>. No por los productos en sí, sino por su obsesión de unir la tecnología con lo humano y cuidar cada detalle, incluso los que nadie ve.</p>" +
      '<div class="quote">"No podés unir los puntos mirando hacia adelante; solo podés unirlos mirando hacia atrás."<span class="dim">— Steve Jobs, Stanford, 2005</span></div>' +

  };

  C.proyectos = function () {
    block('<div class="dim">total ' + ORDER.length + "</div>" + rows(ORDER.map(function (k) {
      var p = PROJECTS[k];
      return ['<span class="dim">drwxr-x</span> ' + cmdLink("ver " + k, p.dir + "/"), p.short];
    })) + '<div class="dim" style="margin-top:12px">→ tocá un nombre o escribí <span class="c">ver aym</span></div>');
  };

  C.ver = function (arg) {
    var key = PROJECT_ALIAS[(arg || "").toLowerCase().replace(/\/$/, "")];
    if (!key) {
      block((arg ? '<span class="r">no existe el proyecto: ' + esc(arg) + "</span><br>" : "") +
        "Proyectos: " + ORDER.map(function (k) { return cmdLink("ver " + k, k); }).join(" · "));
      return;
    }
    var p = PROJECTS[key];
    var next = ORDER[(ORDER.indexOf(key) + 1) % ORDER.length];
    var b = block('<div class="case-title"><strong>' + p.title + '</strong><span class="tag ' + p.tag[0] + '">' + p.tag[1] + "</span></div>" +
      figure(p.img, p.caption) + rows(p.rows) + hint(["ver " + next, "proyectos"]));
    wireFigures(b);
  };

  C.stack = function () {
    block(rows([
      ["lenguajes", "Python · JavaScript · SQL · HTML/CSS"],
      ["backend", "FastAPI · Supabase · PostgreSQL · SQLite · Cloudflare Pages Functions"],
      ["frontend", "React · Vite · Tailwind"],
      ["visión e IA", "OpenCV · MediaPipe · InsightFace · Gemini API · SymPy"],
      ["escritorio", "PySide6 (Qt)"],
      ["calidad", "pytest · Git · GitHub Actions"],
      ["con IA", "desarrollo con asistentes como Claude Code, revisando cada línea"]
    ]));
  };

  C.experiencia = function () {
    block(rows([
      ['<span class="a">2026 — hoy</span>', "<strong>Analista de datos y desarrollo web</strong> · A&amp;M Piscinas<br><span class=\"dim\">Gestiono la información de la empresa, automatizo flujos de trabajo y desarrollé su plataforma web y su sistema de gestión.</span>"],
      ['<span class="a">2024 — 2026</span>', "<strong>Director de ventas y marketing</strong> · A&amp;M Piscinas<br><span class=\"dim\">Atención al cliente y publicidad. Digitalicé la gestión de clientes que se llevaba en papel: ventas +10 %.</span>"]
    ]));
  };

  C.formacion = function () {
    block(rows([
      ["UTN", "Ingeniería en Sistemas de Información <span class=\"dim\">· 2023 — en curso</span>"],
      ["FAMAF — UNC", "Introducción a la Ciberseguridad <span class=\"dim\">· en curso</span>"],
      ["IBM SkillsBuild", "Cybersecurity Fluency"],
      ["Santander", "Python"],
      ["idiomas", "Español nativo · Inglés B2"]
    ]));
  };

  C.musica = function () {
    block('<div class="h">♫ musica<span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>' +
      "<p>Además de programar, mezclo música electrónica.</p>" +
      "<p>WaveLoad nació ahí: tenía una biblioteca de casi 800 temas y ninguna herramienta que la organizara como yo quería. Así que la construí.</p>" +
      "<p>Para mí, armar un set y diseñar software se parecen: elegir qué va con qué, cuidar las transiciones y pensar en quien está del otro lado.</p>" +
      hint(["ver waveload", "historia"]));
  };

  C.servicios = function () {
    block('<div class="dim" style="margin-bottom:8px">Para empresas, emprendedores y startups:</div>' + rows([
      ['<span class="g">→</span> sitios y apps web', "de la landing al cotizador online"],
      ['<span class="g">→</span> sistemas de gestión', "clientes, ventas, cobros y stock en un solo lugar"],
      ['<span class="g">→</span> automatización con IA', "procesos repetitivos que se resuelven solos"],
      ['<span class="g">→</span> seguridad desde el diseño', "permisos y datos personales protegidos desde el día uno"]
    ]) + hint(["contacto"]));
  };

  C.contacto = function () {
    block(rows([
      ["email", '<a href="mailto:brunosavarella@gmail.com">brunosavarella@gmail.com</a>'],
      ["linkedin", ext("https://www.linkedin.com/in/brunosavarella/", "linkedin.com/in/brunosavarella")],
      ["github", ext("https://github.com/Brun02005", "github.com/Brun02005")],
      ["ubicación", "Córdoba, Argentina · remoto"]
    ]) + '<div class="dim" style="margin-top:12px">Te respondo a la brevedad.</div>');
  };

  C.simple = function () {
    C.clear();
    ["whoami", "historia"].forEach(function (c) { C[c](); });
    ORDER.forEach(function (k) { C.ver(k); });
    ["experiencia", "formacion", "stack", "musica", "servicios", "contacto"].forEach(function (c) { C[c](); });
  };

  C.clear = function () { out.innerHTML = ""; };
  C.pwd = function () { block("/home/bruno"); };
  C.date = function () { block(new Date().toLocaleString("es-AR", { timeZone: "America/Argentina/Cordoba", dateStyle: "full", timeStyle: "short" })); };
  C.tema = function () { toggleTheme(); block('<span class="dim">tema: ' + currentTheme() + "</span>"); };

  // Easter eggs
  function egg(name, args) {
    if (name === "sudo") return '<span class="r">bruno no está en el archivo sudoers.</span> Este incidente será reportado. 😉<br><span class="dim">Mínimo privilegio, siempre.</span>';
    if (name === "rm" && /-rf/.test(args)) return '<span class="r">Permiso denegado.</span> <span class="dim">Los permisos viven en la base de datos, no en la interfaz.</span>';
    if (name === "hack" || name === "hackear") return "Acceso denegado. Si te interesa la seguridad, probá " + cmdLink("ver bluedar") + ".";
    if (name === "exit" || name === "logout") return "No hay salida… mejor " + cmdLink("contacto", "escribime") + ".";
    if (name === "ping") return '<span class="g">pong</span> <span class="dim">· tiempo de respuesta: lo que tardes en escribirme</span>';
    return null;
  }

  var ALIAS = { "ayuda": "help", "?": "help", "ls": "proyectos", "projects": "proyectos", "about": "whoami",
    "cls": "clear", "cat": "ver", "cd": "ver", "open": "ver", "skills": "stack", "music": "musica", "música": "musica",
    "dj": "musica", "formación": "formacion", "estudios": "formacion", "contact": "contacto", "trabajo": "experiencia",
    "story": "historia", "theme": "tema" };

  // ---------------- ejecución ----------------
  var history = [], hIndex = 0;

  function run(raw) {
    var line = raw.trim();
    var echo = block('<span class="ps1">bruno@cordoba:<span class="path">~</span>$</span> ' + esc(line), "echo");
    if (!line) return;
    history.push(line); hIndex = history.length;
    var parts = line.split(/\s+/);
    var name = parts[0].toLowerCase();
    var args = parts.slice(1).join(" ");
    var key = ALIAS[name] || name;
    if (key === "proyectos" && args) key = "ver";   // "ls aym" funciona como "ver aym"
    if (Object.prototype.hasOwnProperty.call(C, key)) {
      C[key](args);
    } else {
      block(egg(name, args) || '<span class="r">comando no encontrado: ' + esc(parts[0]) + "</span> · escribí " + cmdLink("help"));
    }
    if (key === "clear" || key === "simple") { scrollTo(0, 0); return; }
    var y = echo.getBoundingClientRect().top + scrollY - 52;
    scrollTo({ top: y, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var v = input.value;
    input.value = "";
    run(v);
  });

  var COMMANDS = ["help", "whoami", "historia", "proyectos", "ver", "stack", "experiencia", "formacion", "musica", "servicios", "contacto", "simple", "clear", "tema"];
  input.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp" && history.length) {
      e.preventDefault(); hIndex = Math.max(0, hIndex - 1); input.value = history[hIndex];
    } else if (e.key === "ArrowDown" && history.length) {
      e.preventDefault(); hIndex = Math.min(history.length, hIndex + 1); input.value = history[hIndex] || "";
    } else if (e.key === "Tab") {
      e.preventDefault();
      var v = input.value.toLowerCase();
      var m = v.match(/^(ver|cat|cd)\s+(\S*)$/);
      var pool = m ? ORDER.map(function (k) { return m[1] + " " + k; }) : COMMANDS;
      var hits = pool.filter(function (c) { return c.indexOf(v) === 0; });
      if (hits.length === 1) input.value = hits[0] + (m ? "" : " ");
      else if (hits.length > 1) block('<span class="dim">' + hits.join("   ") + "</span>");
    } else if (e.key === "l" && e.ctrlKey) {
      e.preventDefault(); C.clear();
    }
  });

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-cmd]");
    if (t) {
      e.preventDefault();
      run(t.getAttribute("data-cmd"));
      if (!touch) input.focus({ preventScroll: true });
      return;
    }
    // Click en la terminal = foco en la línea de comando (sin romper la selección de texto)
    if (!touch && e.target.closest("main") && !e.target.closest("a") && !getSelection().toString()) {
      input.focus({ preventScroll: true });
    }
  });

  // ---------------- tema ----------------
  function currentTheme() {
    return root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  }
  function toggleTheme() {
    var next = currentTheme() === "light" ? "dark" : "light";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  }
  try { var saved = localStorage.getItem("theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
  document.getElementById("themeBtn").addEventListener("click", toggleTheme);

  // ---------------- reloj (hora de Córdoba) ----------------
  var clock = document.getElementById("clock");
  function tick() {
    clock.textContent = new Date().toLocaleTimeString("es-AR", { timeZone: "America/Argentina/Cordoba", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  }
  tick(); setInterval(tick, 15000);

  // ---------------- inicio ----------------
  var last = new Date().toLocaleString("es-AR", { timeZone: "America/Argentina/Cordoba", weekday: "short", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  block('<span class="dim">Último inicio de sesión: ' + esc(last) + " desde Córdoba, AR</span>");
  // Links directos: brun02005.github.io/#ver-aym abre ese proyecto
  var start = decodeURIComponent((location.hash || "").slice(1)).replace(/-/g, " ").trim();
  run(/^[a-záéíóú ]{2,30}$/i.test(start) ? start : "whoami");
  block('<span class="dim">Escribí </span>' + cmdLink("help") + '<span class="dim"> o tocá un comando de abajo.</span>');
  scrollTo(0, 0);
  if (!touch) input.focus({ preventScroll: true });
})();
</script>
