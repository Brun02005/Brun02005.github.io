    :root[data-theme="light"] {
      --bg: #fff; --bar: #f4f4f4; --card: #fafafa; --fg: #0d0d0d; --dim: #6b6b6b; --faint: #c8c8c8; --border: #e2e2e2;

    html, body { margin: 0; background: var(--bg); color: var(--fg); }

    a:hover { background: var(--inv-bg); color: var(--inv-fg); text-decoration: none; }
    :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    p { margin: 0 0 12px; }
    button { font: inherit; }

    /* ================= PUERTA DE ENTRADA ================= */
    #gate {
      position: fixed; inset: 0; z-index: 30; background: var(--bg);
      display: grid; place-items: center; text-align: center; padding: 24px;
      transition: opacity .7s ease, visibility .7s;
    }
    #gate.gone { opacity: 0; visibility: hidden; }
    .lambda { width: 120px; height: 120px; margin: 0 auto 28px; }
    .lambda circle { stroke-dasharray: 360; stroke-dashoffset: 360; animation: draw 1.6s .2s ease-out forwards; }
    .lambda path { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 1s 1.2s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    #gate h1 { font-weight: 300; font-size: clamp(22px, 5vw, 34px); letter-spacing: .32em; margin: 0 0 10px; text-transform: uppercase; padding-left: .32em; }

    .enter {
      background: var(--inv-bg); color: var(--inv-fg); border: 1px solid var(--inv-bg);
      padding: 12px 26px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .enter:hover { background: transparent; color: var(--fg); }
    .quiet { background: none; border: 0; color: var(--dim); cursor: pointer; letter-spacing: .1em; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
    .quiet:hover { color: var(--fg); }
    #gate .note { margin-top: 34px; color: var(--faint); font-size: 12px; letter-spacing: .1em; }

      position: sticky; top: 0; z-index: 5; background: var(--bar); border-bottom: 1px solid var(--border);

    .top button { color: var(--dim); background: none; border: 1px solid transparent; padding: 3px 8px; cursor: pointer; }
    .top button:hover { color: var(--fg); border-color: var(--border); }

    figure:hover img, figure:active img { filter: none; }
    figcaption { color: var(--dim); font-size: 12.5px; margin-top: 6px; }

    /* ================= CARRUSEL ================= */
    .carousel { margin: 6px 0 4px; }
    .car-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; gap: 12px; }
    .car-head .title { letter-spacing: .2em; text-transform: uppercase; font-size: 12px; color: var(--dim); }
    .track {
      display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
      scrollbar-width: none; padding-bottom: 2px; outline: none;
    }
    .track::-webkit-scrollbar { display: none; }
    .slide {
      flex: 0 0 min(560px, 88%); scroll-snap-align: start; background: var(--card); border: 1px solid var(--border);
      display: flex; flex-direction: column; transition: border-color .3s ease;
    }
    .slide.active { border-color: var(--dim); }
    .shot { aspect-ratio: 16 / 9; overflow: hidden; border-bottom: 1px solid var(--border); background: var(--bar); position: relative; }
    .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; filter: grayscale(1) contrast(1.05); transition: filter .5s ease, transform .8s ease; }
    .slide:hover .shot img { filter: none; transform: scale(1.02); }
    .shot.art { display: grid; place-items: center; text-align: center; padding: 16px; }
    .shot.art .formula { font-size: clamp(20px, 4vw, 30px); font-weight: 300; letter-spacing: .02em; }
    .shot.art .flow { color: var(--dim); font-size: 12px; letter-spacing: .15em; margin-top: 10px; }
    .slide .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .slide .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .slide .idx { color: var(--faint); font-size: 12px; letter-spacing: .15em; }
    .slide h3 { margin: 0; font-size: 15px; letter-spacing: .06em; font-weight: 600; }
    .slide p { margin: 0; color: var(--dim); font-size: 13.5px; }
    .slide .actions { margin-top: auto; padding-top: 6px; display: flex; gap: 16px; flex-wrap: wrap; font-size: 13.5px; }
    .car-nav { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .car-nav .arrow { width: 34px; height: 30px; background: none; border: 1px solid var(--border); color: var(--fg); cursor: pointer; }
    .car-nav .arrow:hover { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
    .car-nav .arrow:disabled { opacity: .3; cursor: default; background: none; color: var(--fg); border-color: var(--border); }
    .dots { display: flex; gap: 6px; }
    .dots button { width: 18px; height: 4px; padding: 0; border: 0; background: var(--faint); cursor: pointer; transition: background .3s, width .3s; }
    .dots button[aria-current="true"] { background: var(--fg); width: 30px; }
    .car-count { color: var(--dim); font-size: 12px; margin-left: auto; }

    .prompt { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
    .prompt label { flex: none; }
    #cmd {
      flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--fg); background: transparent;
      border: 0; outline: none; caret-color: var(--fg); padding: 2px 0;
    }
    #cmd::placeholder { color: var(--faint); }

    /* ================= DOCK: atajos + reproductor ================= */
    .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bar); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
    .chips { display: flex; gap: 6px; padding: 8px 16px 6px; overflow-x: auto; scrollbar-width: none; max-width: 900px; margin: 0 auto; }
    .chips::-webkit-scrollbar { display: none; }
    .chips button {
      font-size: 13px; flex: none; color: var(--fg); background: var(--bg);
      border: 1px solid var(--border); padding: 3px 10px; cursor: pointer;
    }
    .chips button:hover { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
    .player { display: flex; align-items: center; gap: 12px; padding: 2px 16px 6px; font-size: 12px; color: var(--dim); max-width: 900px; margin: 0 auto; }
    #playBtn { background: none; border: 1px solid var(--border); color: var(--fg); width: 26px; height: 22px; padding: 0; cursor: pointer; font-size: 11px; flex: none; }
    #playBtn:hover { background: var(--inv-bg); color: var(--inv-fg); }
    #np { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #viz { flex: 1; min-width: 40px; height: 18px; display: block; }
    #clock { flex: none; }
    @media (max-width: 520px) { .player .hide-sm { display: none; } }

    @media (prefers-reduced-motion: reduce) {
      .lambda circle, .lambda path { animation: none; stroke-dashoffset: 0; }
      #gate, figure img, .shot img, .reveal { transition: none; }
      .track { scroll-behavior: auto; }
      .caret::after { animation: none; }
    }
    noscript { display: block; max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  </style>
</head>

<script>
(function () {
  "use strict";

  var out = document.getElementById("out");
  var input = document.getElementById("cmd");
  var form = document.getElementById("form");
  var root = document.documentElement;
  var touch = matchMedia("(hover: none)").matches;
  var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // =====================================================================
  //  bruno.js — un tema de house escrito en Web Audio. Nada pregrabado:
  //  cada bombo, hi-hat y acorde se sintetiza en vivo en el navegador.
  // =====================================================================
  var Mix = (function () {
    var ctx, master, analyser, noise, timer;
    var bpm = 122, step = 0, nextTime = 0, playing = false, breakUntil = -1;
    // Am7 · Fmaj7 · Dm7 · Em7 (dos compases cada uno)
    var CHORDS = [[220, 261.63, 329.63, 392], [174.61, 220, 261.63, 329.63], [146.83, 174.61, 220, 261.63], [164.81, 196, 246.94, 293.66]];
    var ROOTS = [110, 87.31, 73.42, 82.41];
    var listeners = [];

    function init() {
      if (ctx) return;
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0;
      var comp = ctx.createDynamicsCompressor();
      analyser = ctx.createAnalyser(); analyser.fftSize = 128;
      master.connect(comp); comp.connect(analyser); analyser.connect(ctx.destination);
      noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      var d = noise.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    function env(g, t, peak, attack, decay) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    }
    function kick(t) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(44, t + 0.11);
      env(g, t, 0.95, 0.003, 0.42);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.5);
    }
    function noiseHit(t, type, freq, q, peak, decay) {
      var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noise; f.type = type; f.frequency.value = freq; f.Q.value = q;
      env(g, t, peak, 0.002, decay);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t, Math.random() * 0.5); s.stop(t + decay + 0.05);
    }
    function clap(t) { [0, 0.011, 0.023].forEach(function (o) { noiseHit(t + o, "bandpass", 1500, 0.9, 0.32, 0.16); }); }
    function bass(t, freq, dur) {
      var o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = "sawtooth"; o.frequency.value = freq;
      f.type = "lowpass"; f.Q.value = 7;
      f.frequency.setValueAtTime(1100, t); f.frequency.exponentialRampToValueAtTime(160, t + dur);
      env(g, t, 0.26, 0.008, dur);
      o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
    }
    function pad(t, freqs, dur) {
      var f = ctx.createBiquadFilter(), g = ctx.createGain();
      f.type = "lowpass"; f.frequency.value = 1300;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.055, t + 0.9);
      g.gain.setValueAtTime(0.055, t + dur - 0.6);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);
      f.connect(g); g.connect(master);
      freqs.forEach(function (fr) {
        [-7, 7].forEach(function (cents) {
          var o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = fr; o.detune.value = cents;

      });

    function playStep(s, t) {
      var st = s % 16, bar = Math.floor(s / 16);
      var chord = Math.floor(bar / 2) % 4;
      var inBreak = bar < breakUntil || (bar % 32 >= 30);   // pausa cada 32 compases
      var intro = bar < 4;
      var sixteenth = 60 / bpm / 4;
      if (st === 0 && bar % 2 === 0) pad(t, CHORDS[chord], sixteenth * 32);
      if (!intro && !inBreak && st % 4 === 0) kick(t);
      if (st % 4 === 2) noiseHit(t, "highpass", 7500, 0.7, intro ? 0.08 : 0.16, 0.09);
      if (!intro && !inBreak && st % 2 === 1) noiseHit(t, "highpass", 9000, 0.7, 0.045, 0.03);
      if (bar >= 8 && !inBreak && (st === 4 || st === 12)) clap(t);
      if (!intro && [2, 6, 10, 14].indexOf(st) >= 0) bass(t, ROOTS[chord] * (st === 14 && bar % 4 === 3 ? 2 : 1), sixteenth * 1.6);
    }
    function scheduler() {
      while (nextTime < ctx.currentTime + 0.12) {
        playStep(step, nextTime);
        nextTime += 60 / bpm / 4;
        step++;
      }
    }
    function emit() { listeners.forEach(function (fn) { fn(); }); }

      play: function () {
        init();
        if (playing) return;
        ctx.resume();
        playing = true;
        nextTime = ctx.currentTime + 0.05;
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
        master.gain.linearRampToValueAtTime(0.42, ctx.currentTime + 2.5);
        timer = setInterval(scheduler, 25);
        emit();
      },
      stop: function () {
        if (!playing) return;

        clearInterval(timer);

        master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
        master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);

        emit();
      },
      toggle: function () { this.playing() ? this.stop() : this.play(); },
      playing: function () { return playing; },

      drop: function () { breakUntil = Math.floor(step / 16) + 3; },

      resume: function () { if (ctx && playing) ctx.resume(); },

    };

      '<button type="button" class="arrow next" aria-label="Proyecto siguiente">→</button><span class="car-count"></span></div></section>');

    var track = b.querySelector(".track"), items = b.querySelectorAll(".slide"), dots = b.querySelectorAll(".dots button");
    var prev = b.querySelector(".prev"), next = b.querySelector(".next"), count = b.querySelector(".car-count");
    b.querySelectorAll(".shot img").forEach(function (img) { img.onerror = function () { img.remove(); }; });
    function stepSize() { return items.length > 1 ? items[1].offsetLeft - items[0].offsetLeft : track.clientWidth; }
    function atEnd() { return track.scrollLeft >= track.scrollWidth - track.clientWidth - 2; }
    function current() { return atEnd() ? n - 1 : Math.max(0, Math.min(n - 1, Math.round(track.scrollLeft / stepSize()))); }
    function go(i) { track.scrollTo({ left: Math.max(0, Math.min(n - 1, i)) * stepSize(), behavior: reduced ? "auto" : "smooth" }); }
    function update() {
      var c = current();
      items.forEach(function (s, i) { s.classList.toggle("active", i === c); });
      dots.forEach(function (d, i) { d.setAttribute("aria-current", i === c ? "true" : "false"); });
      prev.disabled = track.scrollLeft <= 2;
      next.disabled = atEnd();
      count.textContent = (c + 1) + " / " + n;
    }
    prev.addEventListener("click", function (e) { e.stopPropagation(); go(current() - 1); });
    next.addEventListener("click", function (e) { e.stopPropagation(); go(current() + 1); });
    dots.forEach(function (d, i) { d.addEventListener("click", function (e) { e.stopPropagation(); go(i); }); });
    track.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") { e.preventDefault(); go(current() + 1); }
      if (e.key === "ArrowLeft") { e.preventDefault(); go(current() - 1); }
    });
    var pending;
    track.addEventListener("scroll", function () { clearTimeout(pending); pending = setTimeout(update, 60); }, { passive: true });
    addEventListener("resize", update);
    update();
    return b;
  }

  C.drop = function () {
    if (!Mix.playing()) Mix.play();
    Mix.drop();
    block('<span class="dim">break… el bombo vuelve en unos compases. Esperalo.</span>');
  };
  C.bpm = function (arg) {
    var v = parseInt(arg, 10);
    if (!v) { block("tempo actual: " + Mix.bpm() + ' bpm <span class="dim">· usá: bpm 128</span>'); return; }
    Mix.bpm(v);
    block('<span class="dim">tempo: ' + Mix.bpm() + " bpm</span>");
  };

  C.stack = function () {
    block(rows([
      ["lenguajes", "Python · JavaScript · SQL · HTML/CSS"],
      ["backend", "FastAPI · Supabase · PostgreSQL · SQLite · Cloudflare Pages Functions"],
      ["frontend", "React · Vite · Tailwind · Web Audio API"],
      ["visión e IA", "OpenCV · MediaPipe · InsightFace · Gemini API · SymPy"],
      ["escritorio", "PySide6 (Qt)"],
      ["calidad", "pytest · Git · GitHub Actions"],
      ["con IA", "desarrollo con asistentes como Claude Code, revisando cada línea"]
    ]));
  };

  C.experiencia = function () {
    block(rows([
      ["2026 — hoy", "<strong>Analista de datos y desarrollo web</strong> · A&amp;M Piscinas<br><span class=\"dim\">Gestiono la información de la empresa, automatizo flujos de trabajo y desarrollé su plataforma web y su sistema de gestión.</span>"],
      ["2024 — 2026", "<strong>Director de ventas y marketing</strong> · A&amp;M Piscinas<br><span class=\"dim\">Atención al cliente y publicidad. Digitalicé la gestión de clientes que se llevaba en papel: ventas +10 %.</span>"]
    ]));
  };

  C.formacion = function () {
    block(rows([
      ["UTN", "Ingeniería en Sistemas de Información <span class=\"dim\">· 2023 — en curso</span>"],
      ["FAMAF — UNC", "Introducción a la Ciberseguridad <span class=\"dim\">· en curso</span>"],
      ["IBM SkillsBuild", "Cybersecurity Fluency"],
      ["Santander", "Python"],
      ["idiomas", "Español nativo · Inglés B2"]
    ]));
  };

  C.servicios = function () {
    block('<div class="dim" style="margin-bottom:8px">Para empresas, emprendedores y startups:</div>' + rows([
      ["→ sitios y apps web", "de la landing al cotizador online"],
      ["→ sistemas de gestión", "clientes, ventas, cobros y stock en un solo lugar"],
      ["→ automatización con IA", "procesos repetitivos que se resuelven solos"],
      ["→ seguridad desde el diseño", "permisos y datos personales protegidos desde el día uno"]
    ]) + hint(["contacto"]));
  };

  C.contacto = function () {
    block(rows([
      ["email", '<a href="mailto:brunosavarella@gmail.com">brunosavarella@gmail.com</a>'],
      ["linkedin", ext("https://www.linkedin.com/in/brunosavarella/", "linkedin.com/in/brunosavarella")],
      ["github", ext("https://github.com/Brun02005", "github.com/Brun02005")],
      ["base", "Córdoba, Argentina · remoto"]
    ]) + '<div class="dim" style="margin-top:12px">Escribime. Te respondo a la brevedad.</div>');
  };

  C.simple = function () {
    C.clear();
    skipping = true; sequenceRunning = true;
    return presentation().then(function () {
      sequenceRunning = false; skipping = false;
      ORDER.forEach(function (k) { C.ver(k); });
      ["experiencia", "formacion", "stack", "servicios", "contacto"].forEach(function (c) { C[c](); });
      scrollTo(0, 0);
    });
  };

  C.clear = function () { out.innerHTML = ""; };
  C.whoami = function () { block("Bruno Savarella · DJ · programador · software · Córdoba, AR" + hint(["inicio", "proyectos"])); };
  C.pwd = function () { block("/home/bruno"); };
  C.tema = function () { toggleTheme(); };

  // Cosas escondidas (para quien las busque)
  function egg(name, args) {
    if (name === "sudo") return "bruno no está en el archivo sudoers. Este incidente será reportado. 😉<br><span class=\"dim\">Mínimo privilegio, siempre.</span>";
    if (name === "rm" && /-rf/.test(args)) return "Permiso denegado. <span class=\"dim\">Los permisos viven en la base de datos, no en la interfaz.</span>";
    if (name === "λ" || name === "lambda") return "λ — una función sin nombre. O un símbolo de resistencia, según a quién le preguntes.";
    if (name === "crowbar" || name === "palanca") return "Agarraste la palanca. No hay caso que se resista: " + ORDER.map(function (k) { return cmdLink("ver " + k, k); }).join(" · ");
    if (name === "gman" || name === "g-man") return '<div class="quote">"The right man in the wrong place can make all the difference in the world."</div>';
    if (name === "freeman" || name === "gordon") return "Gordon no habla. Yo sí: " + cmdLink("contacto", "escribime") + ".";
    if (name === "jobs") return '<div class="quote">"Stay hungry. Stay foolish."<span class="dim">— Stanford, 2005</span></div>';
    if (name === "exit" || name === "logout") return "No hay salida. Mejor " + cmdLink("contacto", "escribime") + ".";
    if (name === "hack" || name === "hackear") return "Acceso denegado. Si te interesa la seguridad, probá " + cmdLink("ver bluedar") + ".";
    if (name === "ping") return "pong <span class=\"dim\">· tiempo de respuesta: lo que tardes en escribirme</span>";
    return null;
  }

  var ALIAS = { "ayuda": "help", "?": "help", "ls": "proyectos", "projects": "proyectos", "historia": "inicio",
    "about": "inicio", "sobre": "inicio", "home": "inicio", "carta": "inicio", "cls": "clear", "cat": "ver", "cd": "ver", "open": "ver", "skills": "stack", "music": "musica",
    "música": "musica", "dj": "musica", "pause": "stop", "pausa": "stop", "formación": "formacion", "estudios": "formacion",
    "contact": "contacto", "trabajo": "experiencia", "theme": "tema", "invertir": "tema" };

  // ---------------- ejecución ----------------
  var history = [], hIndex = 0;

  function run(raw) {
    if (sequenceRunning) { skip(); return; }
    var line = raw.trim();
    var echo = block('<span class="ps1">bruno@cordoba:<span class="path">~</span>$</span> ' + esc(line), "echo");
    if (!line) return;
    history.push(line); hIndex = history.length;
    var parts = line.split(/\s+/), name = parts[0].toLowerCase(), args = parts.slice(1).join(" ");
    var key = ALIAS[name] || name;
    if (key === "proyectos" && args) key = "ver";
    var result;
    if (Object.prototype.hasOwnProperty.call(C, key)) result = C[key](args);
    else block(egg(name, args) || "comando no encontrado: " + esc(parts[0]) + ' <span class="dim">·</span> ' + cmdLink("help"));
    if (key === "clear" || key === "simple") { scrollTo(0, 0); return; }
    if (result && result.then) return;
    var y = echo.getBoundingClientRect().top + scrollY - 52;
    scrollTo({ top: y, behavior: reduced ? "auto" : "smooth" });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var v = input.value; input.value = "";
    run(v);
  });

  var COMMANDS = ["help", "inicio", "proyectos", "ver", "musica", "play", "stop", "drop", "bpm", "stack", "experiencia", "formacion", "servicios", "contacto", "simple", "clear"];
  input.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp" && history.length) {
      e.preventDefault(); hIndex = Math.max(0, hIndex - 1); input.value = history[hIndex];
    } else if (e.key === "ArrowDown" && history.length) {
      e.preventDefault(); hIndex = Math.min(history.length, hIndex + 1); input.value = history[hIndex] || "";
    } else if (e.key === "Tab") {
      e.preventDefault();
      var v = input.value.toLowerCase(), m = v.match(/^(ver|cat|cd)\s+(\S*)$/);
      var pool = m ? ORDER.map(function (k) { return m[1] + " " + k; }) : COMMANDS;
      var hits = pool.filter(function (c) { return c.indexOf(v) === 0; });
      if (hits.length === 1) input.value = hits[0] + (m ? "" : " ");
      else if (hits.length > 1) block('<span class="dim">' + hits.join("   ") + "</span>");
    } else if (e.key === "l" && e.ctrlKey) {
      e.preventDefault(); C.clear();
    }
  });

  document.addEventListener("click", function (e) {
    if (!gate.classList.contains("gone")) return;
    if (sequenceRunning && !e.target.closest("#playBtn, .top")) { skip(); return; }
    var t = e.target.closest("[data-cmd]");
    if (t) {
      e.preventDefault();
      run(t.getAttribute("data-cmd"));
      if (!touch) input.focus({ preventScroll: true });
      return;
    }
    if (!touch && e.target.closest("main") && !e.target.closest("a, .carousel") && !getSelection().toString()) input.focus({ preventScroll: true });
  });
  document.addEventListener("keydown", function (e) {
    if (sequenceRunning && gate.classList.contains("gone") && e.key !== "Tab") skip();
  });

  // ---------------- tema ----------------
  function currentTheme() {
    return root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  }
  function toggleTheme() {
    var next = currentTheme() === "light" ? "dark" : "light";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  }
  try { var saved = localStorage.getItem("theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
  document.getElementById("themeBtn").addEventListener("click", function (e) { e.stopPropagation(); toggleTheme(); });

  // ---------------- reloj ----------------
  var timeEl = document.getElementById("time");
  function tick() {
    timeEl.textContent = new Date().toLocaleTimeString("es-AR", { timeZone: "America/Argentina/Cordoba", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  }
  tick(); setInterval(tick, 15000);

  // ---------------- entrada ----------------
  var gate = document.getElementById("gate");
  var startCmd = decodeURIComponent((location.hash || "").slice(1)).replace(/-/g, " ").trim();
  if (!/^[a-záéíóúλ ]{2,30}$/i.test(startCmd)) startCmd = "";

  function enter(withSound) {
    if (gate.classList.contains("gone")) return;
    if (withSound) Mix.play();
    gate.classList.add("gone");
    document.removeEventListener("keydown", gateKeys);
    if (startCmd) {
      run(startCmd);
      block('<span class="dim">Escribí </span>' + cmdLink("help") + '<span class="dim"> o tocá un comando de abajo.</span>');
      scrollTo(0, 0);
    } else {
      runSequence(function () { return boot().then(presentation); });
    }
    if (!touch) input.focus({ preventScroll: true });
  }
  function gateKeys(e) {
    if (e.key === "Enter") { e.preventDefault(); enter(true); }
    else if (e.key === "Escape") enter(false);
  }
  document.getElementById("enterSound").addEventListener("click", function () { enter(true); });
  document.getElementById("enterQuiet").addEventListener("click", function () { enter(false); });
  document.addEventListener("keydown", gateKeys);
  document.getElementById("enterSound").focus({ preventScroll: true });

  // ?simple entra directo, sin sonido y con todo el contenido (útil para compartir o imprimir)
  if (/[?&]simple\b/.test(location.search)) {
    gate.style.transition = "none";
    gate.classList.add("gone");
    document.removeEventListener("keydown", gateKeys);
    C.simple();
  }
})();
</script>
</body>
</html>
