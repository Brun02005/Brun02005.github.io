  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M22 46 L32 26 M26 18 L42 46' stroke='%23fff' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000; --bar: #0a0a0a; --fg: #f2f2f2; --dim: #8c8c8c; --faint: #3a3a3a; --border: #222;
      --inv-bg: #f2f2f2; --inv-fg: #000;
      --mono: "JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #fff; --bar: #f4f4f4; --fg: #0d0d0d; --dim: #6b6b6b; --faint: #c8c8c8; --border: #e2e2e2;
        --inv-bg: #0d0d0d; --inv-fg: #fff;
      }
    }
    :root[data-theme="light"] {
      --bg: #fff; --bar: #f4f4f4; --fg: #0d0d0d; --dim: #6b6b6b; --faint: #c8c8c8; --border: #e2e2e2;
      --inv-bg: #0d0d0d; --inv-fg: #fff;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    body { font: 15px/1.65 var(--mono); -webkit-font-smoothing: antialiased; min-height: 100vh; }
    ::selection { background: var(--inv-bg); color: var(--inv-fg); }
    a { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
    a:hover { background: var(--inv-bg); color: var(--inv-fg); text-decoration: none; }
    :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    p { margin: 0 0 12px; }
    button { font: inherit; }

    /* ================= PUERTA DE ENTRADA ================= */
    #gate {
      position: fixed; inset: 0; z-index: 30; background: var(--bg);
      display: grid; place-items: center; text-align: center; padding: 24px;
      transition: opacity .7s ease, visibility .7s;
    }
    #gate.gone { opacity: 0; visibility: hidden; }
    .lambda { width: 132px; height: 132px; margin: 0 auto 28px; }
    .lambda circle { stroke-dasharray: 360; stroke-dashoffset: 360; animation: draw 1.6s .2s ease-out forwards; }
    .lambda path { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 1s 1.2s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    #gate h1 { font-weight: 300; font-size: clamp(22px, 5vw, 34px); letter-spacing: .32em; margin: 0 0 10px; text-transform: uppercase; padding-left: .32em; }
    #gate .tagline { color: var(--dim); letter-spacing: .25em; font-size: 13px; text-transform: uppercase; margin-bottom: 38px; }
    .gate-actions { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .enter {
      background: var(--inv-bg); color: var(--inv-fg); border: 1px solid var(--inv-bg);
      padding: 12px 26px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .enter:hover { background: transparent; color: var(--fg); }
    .quiet { background: none; border: 0; color: var(--dim); cursor: pointer; letter-spacing: .1em; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
    .quiet:hover { color: var(--fg); }
    #gate .note { margin-top: 34px; color: var(--faint); font-size: 12px; letter-spacing: .1em; }

    /* ================= TARJETA DE CAPÍTULO ================= */
    #chapter {
      position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center;
      background: color-mix(in srgb, var(--bg) 88%, transparent); pointer-events: none;
      opacity: 0; transition: opacity .45s ease; padding: 24px;
    }
    #chapter.show { opacity: 1; }
    #chapter .n { color: var(--dim); letter-spacing: .5em; font-size: 12px; padding-left: .5em; }
    #chapter .t { font-size: clamp(22px, 5vw, 40px); font-weight: 300; letter-spacing: .28em; padding-left: .28em; margin-top: 10px; text-transform: uppercase; }
    #chapter .o { color: var(--faint); font-size: 12px; letter-spacing: .3em; margin-top: 12px; text-transform: uppercase; }

    /* ================= BARRA SUPERIOR ================= */
    .top {
      position: sticky; top: 0; z-index: 5; background: var(--bar); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 0 16px; height: 40px; font-size: 13px; color: var(--dim);
    }
    .tab { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-actions { display: flex; gap: 4px; flex: none; }
    .top button { color: var(--dim); background: none; border: 1px solid transparent; padding: 3px 8px; cursor: pointer; }
    .top button:hover { color: var(--fg); border-color: var(--border); }

    /* ================= TERMINAL ================= */
    main { max-width: 900px; margin: 0 auto; padding: 22px 16px 160px; }
    .blk { margin: 0 0 14px; }
    .echo { margin: 26px 0 8px; word-break: break-word; }
    .ps1 { font-weight: 600; white-space: nowrap; }
    .ps1 .path { color: var(--dim); }
    .dim { color: var(--dim); }
    .faint { color: var(--faint); }
    .inv { background: var(--inv-bg); color: var(--inv-fg); padding: 0 6px; }
    .boot { color: var(--dim); }
    .boot .ok { color: var(--fg); }
    .caphead { margin: 30px 0 12px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .caphead .num { background: var(--inv-bg); color: var(--inv-fg); padding: 0 8px; font-size: 12px; letter-spacing: .2em; }
    .caphead .tt { letter-spacing: .2em; text-transform: uppercase; font-weight: 600; }
    .caphead .oo { color: var(--faint); font-size: 12px; letter-spacing: .15em; text-transform: uppercase; }
    .letter p { max-width: 68ch; }
    .quote { border-left: 2px solid var(--fg); padding: 2px 0 2px 16px; margin: 18px 0; font-style: italic; max-width: 68ch; }
    .quote .dim { font-style: normal; display: block; margin-top: 4px; }
    .caret::after { content: "▌"; animation: blink 1s steps(1) infinite; margin-left: 1px; }
    @keyframes blink { 50% { opacity: 0; } }

    .rows { display: grid; grid-template-columns: max-content 1fr; column-gap: 24px; row-gap: 5px; }
    .rows > :nth-child(odd) { color: var(--dim); }
    @media (max-width: 560px) {
      .rows { grid-template-columns: 1fr; row-gap: 0; }
      .rows > :nth-child(even) { margin-bottom: 9px; }
    }
    button.cmd {
      color: var(--fg); background: none; border: 0; padding: 0; cursor: pointer;
      text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; text-align: left;
    }
    button.cmd:hover { background: var(--inv-bg); color: var(--inv-fg); text-decoration: none; }

    .case-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 12px; }
    .case-title strong { font-size: 17px; }
    .tag { font-size: 11.5px; padding: 0 8px; letter-spacing: .15em; border: 1px solid var(--fg); }
    .tag.solid { background: var(--inv-bg); color: var(--inv-fg); }
    figure { margin: 4px 0 16px; max-width: 760px; }
    figure img { display: block; width: 100%; height: auto; border: 1px solid var(--border); filter: grayscale(1) contrast(1.05); transition: filter .5s ease; }
    figure:hover img, figure:active img { filter: none; }
    figcaption { color: var(--dim); font-size: 12.5px; margin-top: 6px; }

    .prompt { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
    .prompt label { flex: none; }
    #cmd {
      flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--fg); background: transparent;
      border: 0; outline: none; caret-color: var(--fg); padding: 2px 0;
    }
    #cmd::placeholder { color: var(--faint); }

    /* ================= DOCK: atajos + reproductor ================= */
    .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bar); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
    .chips { display: flex; gap: 6px; padding: 8px 16px 6px; overflow-x: auto; scrollbar-width: none; max-width: 900px; margin: 0 auto; }
    .chips::-webkit-scrollbar { display: none; }
    .chips button {
      font-size: 13px; flex: none; color: var(--fg); background: var(--bg);
      border: 1px solid var(--border); padding: 3px 10px; cursor: pointer;
    }
    .chips button:hover { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
    .player { display: flex; align-items: center; gap: 12px; padding: 2px 16px 6px; font-size: 12px; color: var(--dim); max-width: 900px; margin: 0 auto; }
    #playBtn { background: none; border: 1px solid var(--border); color: var(--fg); width: 26px; height: 22px; padding: 0; cursor: pointer; font-size: 11px; flex: none; }
    #playBtn:hover { background: var(--inv-bg); color: var(--inv-fg); }
    #np { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #viz { flex: 1; min-width: 40px; height: 18px; display: block; }
    #clock { flex: none; }
    @media (max-width: 520px) { .player .hide-sm { display: none; } }

    @media (prefers-reduced-motion: reduce) {
      .lambda circle, .lambda path { animation: none; stroke-dashoffset: 0; }
      #gate, #chapter, figure img { transition: none; }
      .caret::after { animation: none; }
    }
    noscript { display: block; max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  </style>
</head>

<script>
(function () {
  "use strict";

  var out = document.getElementById("out");
  var input = document.getElementById("cmd");
  var form = document.getElementById("form");
  var root = document.documentElement;
  var touch = matchMedia("(hover: none)").matches;
  var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // =====================================================================
  //  bruno.js — un tema de house escrito en Web Audio. Nada pregrabado:
  //  cada bombo, hi-hat y acorde se sintetiza en vivo en el navegador.
  // =====================================================================
  var Mix = (function () {
    var ctx, master, analyser, noise, timer;
    var bpm = 122, step = 0, nextTime = 0, playing = false, breakUntil = -1;
    // Am7 · Fmaj7 · Dm7 · Em7 (dos compases cada uno)
    var CHORDS = [[220, 261.63, 329.63, 392], [174.61, 220, 261.63, 329.63], [146.83, 174.61, 220, 261.63], [164.81, 196, 246.94, 293.66]];
    var ROOTS = [110, 87.31, 73.42, 82.41];
    var listeners = [];

    function init() {
      if (ctx) return;
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0;
      var comp = ctx.createDynamicsCompressor();
      analyser = ctx.createAnalyser(); analyser.fftSize = 128;
      master.connect(comp); comp.connect(analyser); analyser.connect(ctx.destination);
      noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      var d = noise.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    function env(g, t, peak, attack, decay) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    }
    function kick(t) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(44, t + 0.11);
      env(g, t, 0.95, 0.003, 0.42);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.5);
    }
    function noiseHit(t, type, freq, q, peak, decay) {
      var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noise; f.type = type; f.frequency.value = freq; f.Q.value = q;
      env(g, t, peak, 0.002, decay);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t, Math.random() * 0.5); s.stop(t + decay + 0.05);
    }
    function clap(t) { [0, 0.011, 0.023].forEach(function (o) { noiseHit(t + o, "bandpass", 1500, 0.9, 0.32, 0.16); }); }
    function bass(t, freq, dur) {
      var o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = "sawtooth"; o.frequency.value = freq;
      f.type = "lowpass"; f.Q.value = 7;
      f.frequency.setValueAtTime(1100, t); f.frequency.exponentialRampToValueAtTime(160, t + dur);
      env(g, t, 0.26, 0.008, dur);
      o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
    }
    function pad(t, freqs, dur) {
      var f = ctx.createBiquadFilter(), g = ctx.createGain();
      f.type = "lowpass"; f.frequency.value = 1300;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.055, t + 0.9);
      g.gain.setValueAtTime(0.055, t + dur - 0.6);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);
      f.connect(g); g.connect(master);
      freqs.forEach(function (fr) {
        [-7, 7].forEach(function (cents) {
          var o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = fr; o.detune.value = cents;
          o.connect(f); o.start(t); o.stop(t + dur + 0.05);
        });
      });
    }
    function playStep(s, t) {
      var st = s % 16, bar = Math.floor(s / 16);
      var chord = Math.floor(bar / 2) % 4;
      var inBreak = bar < breakUntil || (bar % 32 >= 30);   // pausa cada 32 compases
      var intro = bar < 4;
      var sixteenth = 60 / bpm / 4;
      if (st === 0 && bar % 2 === 0) pad(t, CHORDS[chord], sixteenth * 32);
      if (!intro && !inBreak && st % 4 === 0) kick(t);
      if (st % 4 === 2) noiseHit(t, "highpass", 7500, 0.7, intro ? 0.08 : 0.16, 0.09);
      if (!intro && !inBreak && st % 2 === 1) noiseHit(t, "highpass", 9000, 0.7, 0.045, 0.03);
      if (bar >= 8 && !inBreak && (st === 4 || st === 12)) clap(t);
      if (!intro && [2, 6, 10, 14].indexOf(st) >= 0) bass(t, ROOTS[chord] * (st === 14 && bar % 4 === 3 ? 2 : 1), sixteenth * 1.6);
    }
    function scheduler() {
      while (nextTime < ctx.currentTime + 0.12) {
        playStep(step, nextTime);
        nextTime += 60 / bpm / 4;
        step++;
      }
    }
    function emit() { listeners.forEach(function (fn) { fn(); }); }
    return {
      play: function () {
        init();
        if (playing) return;
        ctx.resume();
        playing = true;
        nextTime = ctx.currentTime + 0.05;
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
        master.gain.linearRampToValueAtTime(0.42, ctx.currentTime + 2.5);
        timer = setInterval(scheduler, 25);
        emit();
      },
      stop: function () {
        if (!playing) return;
        playing = false;
        clearInterval(timer);
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
        master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
        setTimeout(function () { if (!playing) ctx.suspend(); }, 500);
        emit();
      },
      toggle: function () { this.playing() ? this.stop() : this.play(); },
      playing: function () { return playing; },
      bpm: function (v) { if (v) { bpm = Math.max(80, Math.min(150, v)); emit(); } return bpm; },
      drop: function () { breakUntil = Math.floor(step / 16) + 3; },
      analyser: function () { return analyser; },
      suspend: function () { if (ctx && playing) ctx.suspend(); },
      resume: function () { if (ctx && playing) ctx.resume(); },
      on: function (fn) { listeners.push(fn); }
    };
  })();

  // Reproductor del dock
  var playBtn = document.getElementById("playBtn");
  var bpmLbl = document.getElementById("bpmLbl");
  Mix.on(function () {
    playBtn.textContent = Mix.playing() ? "❚❚" : "▶";
    playBtn.setAttribute("aria-label", Mix.playing() ? "Pausar música" : "Reproducir música");
    bpmLbl.textContent = Mix.bpm();
  });
  playBtn.addEventListener("click", function (e) { e.stopPropagation(); Mix.toggle(); });
  document.addEventListener("visibilitychange", function () { document.hidden ? Mix.suspend() : Mix.resume(); });

  // Visualizador en blanco y negro
  var viz = document.getElementById("viz"), vctx = viz.getContext("2d"), vdata = null;
  function drawViz() {
    var w = viz.clientWidth, h = viz.clientHeight, dpr = devicePixelRatio || 1;
    if (viz.width !== w * dpr) { viz.width = w * dpr; viz.height = h * dpr; }
    vctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    vctx.clearRect(0, 0, w, h);
    var color = getComputedStyle(root).getPropertyValue("--fg").trim() || "#fff";
    vctx.fillStyle = color;
    var an = Mix.analyser(), bars = Math.max(8, Math.floor(w / 5));
    if (an && Mix.playing()) {
      vdata = vdata || new Uint8Array(an.frequencyBinCount);
      an.getByteFrequencyData(vdata);
      for (var i = 0; i < bars; i++) {
        var v = vdata[Math.floor(i / bars * vdata.length * 0.75)] / 255;
        var bh = Math.max(1, v * h);
        vctx.fillRect(i * 5, h - bh, 3, bh);
      }

  });

  var COMMANDS = ["help", "carta", "proyectos", "ver", "musica", "play", "stop", "drop", "bpm", "stack", "experiencia", "formacion", "servicios", "contacto", "simple", "clear"];
  input.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp" && history.length) {
      e.preventDefault(); hIndex = Math.max(0, hIndex - 1); input.value = history[hIndex];
    } else if (e.key === "ArrowDown" && history.length) {
      e.preventDefault(); hIndex = Math.min(history.length, hIndex + 1); input.value = history[hIndex] || "";
    } else if (e.key === "Tab") {
      e.preventDefault();
      var v = input.value.toLowerCase(), m = v.match(/^(ver|cat|cd)\s+(\S*)$/);
      var pool = m ? ORDER.map(function (k) { return m[1] + " " + k; }) : COMMANDS;
      var hits = pool.filter(function (c) { return c.indexOf(v) === 0; });
      if (hits.length === 1) input.value = hits[0] + (m ? "" : " ");
      else if (hits.length > 1) block('<span class="dim">' + hits.join("   ") + "</span>");
    } else if (e.key === "l" && e.ctrlKey) {
      e.preventDefault(); C.clear();
    }
  });

  document.addEventListener("click", function (e) {
    if (!gate.classList.contains("gone")) return;
    if (sequenceRunning && !e.target.closest("#playBtn, .top")) { skip(); return; }
    var t = e.target.closest("[data-cmd]");
    if (t) {
      e.preventDefault();
      run(t.getAttribute("data-cmd"));
      if (!touch) input.focus({ preventScroll: true });
      return;
    }
    if (!touch && e.target.closest("main") && !e.target.closest("a") && !getSelection().toString()) input.focus({ preventScroll: true });
  });
  document.addEventListener("keydown", function (e) {
    if (sequenceRunning && gate.classList.contains("gone") && e.key !== "Tab") skip();
  });

  // ---------------- tema ----------------
  function currentTheme() {
    return root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  }
  function toggleTheme() {
    var next = currentTheme() === "light" ? "dark" : "light";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  }
  try { var saved = localStorage.getItem("theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
  document.getElementById("themeBtn").addEventListener("click", function (e) { e.stopPropagation(); toggleTheme(); });

  // ---------------- reloj ----------------
  var timeEl = document.getElementById("time");
  function tick() {
    timeEl.textContent = new Date().toLocaleTimeString("es-AR", { timeZone: "America/Argentina/Cordoba", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  }
  tick(); setInterval(tick, 15000);

  // ---------------- entrada ----------------
  var gate = document.getElementById("gate");
  var startCmd = decodeURIComponent((location.hash || "").slice(1)).replace(/-/g, " ").trim();
  if (!/^[a-záéíóúλ ]{2,30}$/i.test(startCmd)) startCmd = "";

  function enter(withSound) {
    if (gate.classList.contains("gone")) return;
    if (withSound) Mix.play();
    gate.classList.add("gone");
    document.removeEventListener("keydown", gateKeys);
    if (startCmd) {
      run(startCmd);
      block('<span class="dim">Escribí </span>' + cmdLink("help") + '<span class="dim"> o tocá un comando de abajo.</span>');
      scrollTo(0, 0);
    } else {
      runSequence(function () { return boot().then(letter); });
    }
    if (!touch) input.focus({ preventScroll: true });
  }
  function gateKeys(e) {
    if (e.key === "Enter") { e.preventDefault(); enter(true); }
    else if (e.key === "Escape") enter(false);
  }
  document.getElementById("enterSound").addEventListener("click", function () { enter(true); });
  document.getElementById("enterQuiet").addEventListener("click", function () { enter(false); });
  document.addEventListener("keydown", gateKeys);
  document.getElementById("enterSound").focus({ preventScroll: true });

  // ?simple entra directo, sin sonido y con todo el contenido (útil para compartir o imprimir)
  if (/[?&]simple\b/.test(location.search)) {
    gate.style.transition = "none";
    gate.classList.add("gone");
    document.removeEventListener("keydown", gateKeys);
    C.simple();
  }
})();
</script>
</body>
</html>
